# Configuración de Rendimiento Core para el reto2
max_connections = 150
shared_buffers = 128MB
work_mem = 16MB

# Auditoría y mapeo de logs para reto3
logging_collector = off
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
# los % anteriores son para indicar año, mes, día, hora, minuto y segundo del log

# registro de consultas lentas que tarden más de 2 segundos
log_min_duration_statement = 2000